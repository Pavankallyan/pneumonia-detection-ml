name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # src/metrics.py and its tests use only the standard library, so CI
      # installs pytest alone instead of the full notebook stack
      # (torch, jupyter, ...) pinned in requirements.txt.
      - name: Install pytest
        run: pip install pytest
      - name: Byte-compile sources and tests
        run: python -m py_compile src/*.py tests/*.py
      - name: Run tests
        run: python -m pytest tests/ -q
